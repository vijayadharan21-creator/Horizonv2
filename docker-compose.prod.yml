# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.prod.yml  — TaskForge AI Production
#
# Used by the CD pipeline on AWS EC2.
# Images are pulled from Docker Hub (pre-built by CI).
# All secrets are injected as env vars by the deploy.sh script.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ─── Node.js Express Backend ───────────────────────────────────────────────
  server:
    image: ${DOCKERHUB_USERNAME}/taskforge-server:${IMAGE_TAG:-latest}
    container_name: taskforge_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: ${MONGO_URI}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      CLIENT_URL: ${CLIENT_URL}
    networks:
      - taskforge_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── React + Vite Client via Nginx ─────────────────────────────────────────
  client:
    image: ${DOCKERHUB_USERNAME}/taskforge-client:${IMAGE_TAG:-latest}
    container_name: taskforge_client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - taskforge_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ─── Shared Network ────────────────────────────────────────────────────────
networks:
  taskforge_network:
    driver: bridge
