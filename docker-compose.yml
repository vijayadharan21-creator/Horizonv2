# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml — TaskForge AI
#
# Used for BOTH local dev and EC2 production (builds from source).
# On EC2: create a .env file in this directory with production values.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ─── Node.js Express Backend ───────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: taskforge_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env              # reads MONGO_URI, JWT secrets etc from .env
    environment:
      - NODE_ENV=production
      - PORT=5000
    networks:
      - taskforge_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── React + Vite Client via Nginx ─────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: taskforge_client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - taskforge_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ─── Shared Network ────────────────────────────────────────────────────────
networks:
  taskforge_network:
    driver: bridge
