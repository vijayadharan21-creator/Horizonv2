name: CI — TaskForge AI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel any in-progress run for the same branch when a new push arrives
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Backend: Lint + Unit Tests
  # ─────────────────────────────────────────────────────────────────────────────
  backend-test:
    name: 🧪 Backend — Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: 📦 Install server dependencies
        run: npm ci

      - name: 🧪 Run unit tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: ci_test_access_secret_key_do_not_use_in_prod
          JWT_REFRESH_SECRET: ci_test_refresh_secret_key_do_not_use_in_prod
          JWT_ACCESS_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Frontend: Install + Build
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-build:
    name: 🏗️ Frontend — Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: 📦 Install client dependencies
        run: npm ci

      - name: 🏗️ Build Vite app
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5000

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist-${{ github.sha }}
          path: client/dist/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3 — Docker: Build both images (only on main branch)
  # ─────────────────────────────────────────────────────────────────────────────
  docker-build:
    name: 🐳 Docker — Build Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    # Only run Docker build on push to main (not on every PR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🐳 Build & push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/taskforge-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/taskforge-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🐳 Build & push client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/taskforge-client:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/taskforge-client:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4 — CI Status Summary
  # ─────────────────────────────────────────────────────────────────────────────
  ci-summary:
    name: ✅ CI Complete
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: always()

    steps:
      - name: 🔍 Evaluate CI result
        run: |
          echo "Backend Tests : ${{ needs.backend-test.result }}"
          echo "Frontend Build: ${{ needs.frontend-build.result }}"

          if [[ "${{ needs.backend-test.result }}" == "failure" || "${{ needs.frontend-build.result }}" == "failure" ]]; then
            echo "❌ CI FAILED — Check the failing job above."
            exit 1
          fi

          echo "✅ All CI checks passed!"
