name: CI/CD — TaskForge AI

# ─────────────────────────────────────────────────────────────────────────────
# Triggers
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel any in-progress run for the same branch when a new push arrives
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1 — Backend Unit Tests
  # ───────────────────────────────────────────────────────────────────────────
  backend-test:
    name: 🧪 Backend — Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: 📦 Install server dependencies
        run: npm ci

      - name: 🧪 Run unit tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: ci_test_access_secret_key_do_not_use_in_prod
          JWT_REFRESH_SECRET: ci_test_refresh_secret_key_do_not_use_in_prod
          JWT_ACCESS_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2 — Frontend Build
  # ───────────────────────────────────────────────────────────────────────────
  frontend-build:
    name: 🏗️ Frontend — Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: 📦 Install client dependencies
        run: npm ci

      - name: 🏗️ Build Vite app
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5000

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist-${{ github.sha }}
          path: client/dist/
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3 — Docker Build & Push  (main branch push only)
  # ───────────────────────────────────────────────────────────────────────────
  docker-build:
    name: 🐳 Docker — Build & Push Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🐳 Build & push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/taskforge-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/taskforge-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🐳 Build & push client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/taskforge-client:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/taskforge-client:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 4 — Deploy to AWS EC2  (main branch push only, after docker images pushed)
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to EC2
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production
      url: http://${{ secrets.EC2_HOST }}

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: 📋 Copy deploy files to EC2
        run: |
          scp -i ~/.ssh/ec2_key.pem \
            -o StrictHostKeyChecking=no \
            ./scripts/deploy.sh \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/deploy.sh

          scp -i ~/.ssh/ec2_key.pem \
            -o StrictHostKeyChecking=no \
            ./docker-compose.prod.yml \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/docker-compose.yml

          ssh -i ~/.ssh/ec2_key.pem \
            -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "chmod +x /home/${{ secrets.EC2_USER }}/deploy.sh"

      - name: 🚀 SSH into EC2 and run deploy script
        run: |
          ssh -i ~/.ssh/ec2_key.pem \
            -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "DOCKERHUB_USERNAME='${{ secrets.DOCKERHUB_USERNAME }}' \
             DOCKERHUB_TOKEN='${{ secrets.DOCKERHUB_TOKEN }}' \
             IMAGE_TAG='latest' \
             MONGO_URI='${{ secrets.MONGO_URI }}' \
             JWT_ACCESS_SECRET='${{ secrets.JWT_ACCESS_SECRET }}' \
             JWT_REFRESH_SECRET='${{ secrets.JWT_REFRESH_SECRET }}' \
             JWT_ACCESS_EXPIRES_IN='${{ secrets.JWT_ACCESS_EXPIRES_IN }}' \
             JWT_REFRESH_EXPIRES_IN='${{ secrets.JWT_REFRESH_EXPIRES_IN }}' \
             CLIENT_URL='${{ secrets.CLIENT_URL }}' \
             GIT_SHA='${{ github.sha }}' \
             bash /home/${{ secrets.EC2_USER }}/deploy.sh"

      - name: 🏥 Health check — verify deployment
        run: |
          echo "⏳ Waiting 30s for containers to initialise..."
          sleep 30

          echo "🔍 Polling health endpoint (5 attempts, 10s apart)..."
          MAX_RETRIES=5
          RETRY=0
          until HEALTH=$(curl --silent --fail --max-time 15 \
            "http://${{ secrets.EC2_HOST }}/api/health" 2>/dev/null); do
            RETRY=$((RETRY + 1))
            if [ "$RETRY" -ge "$MAX_RETRIES" ]; then
              echo "❌ Health check failed after $MAX_RETRIES attempts."
              exit 1
            fi
            echo "  Attempt $RETRY/$MAX_RETRIES failed — retrying in 10s..."
            sleep 10
          done

          if echo "$HEALTH" | grep -q '"status":"healthy"'; then
            echo "✅ Deployment successful! API is healthy."
            echo "$HEALTH"
          else
            echo "❌ Unexpected health response:"
            echo "$HEALTH"
            exit 1
          fi

      - name: 📣 Notify deployment success
        if: success()
        run: |
          echo "🎉 TaskForge AI deployed successfully!"
          echo "   Commit : ${{ github.sha }}"
          echo "   Image  : ${{ secrets.DOCKERHUB_USERNAME }}/taskforge-server:latest"
          echo "   URL    : http://${{ secrets.EC2_HOST }}"
          echo "   Time   : $(date -u)"

      - name: 🚨 Notify deployment failure
        if: failure()
        run: |
          echo "❌ Deployment FAILED for commit ${{ github.sha }}"
          echo "Check EC2 logs with: docker compose logs"

      - name: 🧹 Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/ec2_key.pem
