name: CI/CD — TaskForge AI

# ─────────────────────────────────────────────────────────────────────────────
# Triggers
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1 — Backend Unit Tests
  # ───────────────────────────────────────────────────────────────────────────
  backend-test:
    name: 🧪 Backend — Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: 📦 Install server dependencies
        run: npm ci

      - name: 🧪 Run unit tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: ci_test_access_secret_key_do_not_use_in_prod
          JWT_REFRESH_SECRET: ci_test_refresh_secret_key_do_not_use_in_prod
          JWT_ACCESS_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2 — Frontend Build
  # ───────────────────────────────────────────────────────────────────────────
  frontend-build:
    name: 🏗️ Frontend — Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: 📦 Install client dependencies
        run: npm ci

      - name: 🏗️ Build Vite app
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5000

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist-${{ github.sha }}
          path: client/dist/
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3 — Deploy to EC2  (main branch push only)
  #
  # Strategy: SSH into EC2 → cd to cloned repo → git pull → docker compose up
  # No Docker Hub, no deploy scripts — EC2 builds images directly from source.
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to EC2
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment: production

    steps:
      - name: 🔐 Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: 🚀 SSH → git pull → docker compose up
        run: |
          ssh -i ~/.ssh/ec2_key.pem \
            -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'

            set -e

            echo "📁 Moving to project directory..."
            cd /home/ubuntu/Horizonv2

            echo "⬇️  Pulling latest code from main..."
            git pull origin main

            echo "🛑 Stopping existing containers..."
            sudo docker compose down --timeout 30 || true

            echo "🐳 Building and starting containers..."
            sudo docker compose up -d --build

            echo "✅ Containers started."
            sudo docker compose ps
          EOF

      - name: 🏥 Health check — verify deployment
        run: |
          echo "⏳ Waiting 40s for containers to initialise..."
          sleep 40

          echo "🔍 Polling /api/health (5 attempts, 10s apart)..."
          for i in 1 2 3 4 5; do
            HEALTH=$(curl --silent --max-time 10 \
              "http://${{ secrets.EC2_HOST }}/api/health" 2>/dev/null || echo "FAILED")

            if echo "$HEALTH" | grep -q '"status":"healthy"'; then
              echo "✅ Deployment successful! API is healthy."
              echo "$HEALTH"
              exit 0
            fi

            echo "  Attempt $i/5 — not ready yet, retrying in 10s..."
            sleep 10
          done

          echo "❌ Health check failed after 5 attempts."
          exit 1

      - name: 📣 Deployment summary
        if: success()
        run: |
          echo "🎉 TaskForge AI deployed!"
          echo "   Commit : ${{ github.sha }}"
          echo "   URL    : http://${{ secrets.EC2_HOST }}"
          echo "   Time   : $(date -u)"

      - name: 🚨 On failure
        if: failure()
        run: |
          echo "❌ Deploy FAILED — ${{ github.sha }}"
          echo "SSH into EC2 and run: cd ~/Horizonv2 && docker compose logs"

      - name: 🧹 Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/ec2_key.pem
