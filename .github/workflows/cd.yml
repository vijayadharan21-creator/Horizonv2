name: CD — Manual Re-Deploy to EC2

# ─────────────────────────────────────────────────────────────────────────────
# Manual re-deploy: SSH → cd to project folder → git pull → docker compose up
# Use this to re-deploy without making a code change (e.g. after fixing .env).
# ─────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    name: 🚀 Manual Deploy to EC2
    runs-on: ubuntu-latest

    environment: production

    steps:
      - name: 🔐 Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: 🚀 SSH → git pull → docker compose up
        run: |
          ssh -i ~/.ssh/ec2_key.pem \
            -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'

            set -e

            echo "📁 Moving to project directory..."
            cd /home/ubuntu/Horizonv2

            echo "⬇️  Pulling latest code from main..."
            git pull origin main

            echo "🛑 Stopping existing containers..."
            sudo docker compose down --timeout 30 || true

            echo "🐳 Building and starting containers..."
            sudo docker compose up -d --build

            echo "✅ Done."
            sudo docker compose ps
          EOF

      - name: 🏥 Health check
        run: |
          echo "⏳ Waiting 40s..."
          sleep 40

          for i in 1 2 3 4 5; do
            HEALTH=$(curl --silent --max-time 10 \
              "http://${{ secrets.EC2_HOST }}/api/health" 2>/dev/null || echo "FAILED")

            if echo "$HEALTH" | grep -q '"status":"healthy"'; then
              echo "✅ Healthy — $HEALTH"
              exit 0
            fi
            echo "  Attempt $i/5 retrying..."
            sleep 10
          done

          echo "❌ Health check failed."
          exit 1

      - name: 🧹 Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/ec2_key.pem
