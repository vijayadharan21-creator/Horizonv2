name: CD — Deploy to AWS EC2

on:
  # Triggers ONLY after the CI pipeline completes successfully on main
  workflow_run:
    workflows: ["CI — TaskForge AI"]
    types: [completed]
    branches: [main]

  # Allow manual deploy from GitHub Actions UI
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy (default: latest)'
        required: false
        default: 'latest'

concurrency:
  group: cd-production
  cancel-in-progress: false  # Never cancel an active deployment

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_TAG: ${{ github.event.inputs.image_tag || 'latest' }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Gate: Only deploy if CI passed (for workflow_run trigger)
  # ─────────────────────────────────────────────────────────────────────────────
  check-ci:
    name: 🔍 Verify CI Passed
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.gate.outputs.should_deploy }}

    steps:
      - name: 🔍 Check CI workflow conclusion
        id: gate
        run: |
          CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          TRIGGER="${{ github.event_name }}"

          # Allow manual deploys regardless; auto-deploys only if CI passed
          if [[ "$TRIGGER" == "workflow_dispatch" ]]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "✅ Manual deploy requested — proceeding."
          elif [[ "$CONCLUSION" == "success" ]]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "✅ CI passed — proceeding with deployment."
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo "❌ CI did not pass (conclusion: $CONCLUSION) — skipping deploy."
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Deploy to EC2 via SSH
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to EC2
    runs-on: ubuntu-latest
    needs: check-ci
    if: needs.check-ci.outputs.should_deploy == 'true'

    environment:
      name: production
      url: http://${{ secrets.EC2_HOST }}

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: 📋 Copy deploy script to EC2
        run: |
          scp -i ~/.ssh/ec2_key.pem \
            ./scripts/deploy.sh \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/deploy.sh

          scp -i ~/.ssh/ec2_key.pem \
            ./docker-compose.prod.yml \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/docker-compose.yml

      - name: 🚀 SSH into EC2 and deploy
        run: |
          # Env vars must be explicitly forwarded into the remote SSH session.
          # GitHub Actions `env:` block only sets vars on the local runner.
          ssh -i ~/.ssh/ec2_key.pem \
            -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "DOCKERHUB_USERNAME='${{ secrets.DOCKERHUB_USERNAME }}' \
             DOCKERHUB_TOKEN='${{ secrets.DOCKERHUB_TOKEN }}' \
             IMAGE_TAG='${{ env.IMAGE_TAG }}' \
             MONGO_URI='${{ secrets.MONGO_URI }}' \
             JWT_ACCESS_SECRET='${{ secrets.JWT_ACCESS_SECRET }}' \
             JWT_REFRESH_SECRET='${{ secrets.JWT_REFRESH_SECRET }}' \
             JWT_ACCESS_EXPIRES_IN='${{ secrets.JWT_ACCESS_EXPIRES_IN }}' \
             JWT_REFRESH_EXPIRES_IN='${{ secrets.JWT_REFRESH_EXPIRES_IN }}' \
             CLIENT_URL='${{ secrets.CLIENT_URL }}' \
             GIT_SHA='${{ github.sha }}' \
             bash /home/${{ secrets.EC2_USER }}/deploy.sh"

      - name: 🏥 Health check — verify deployment
        run: |
          echo "⏳ Waiting 20s for containers to start..."
          sleep 20

          echo "🔍 Checking health endpoint..."
          HEALTH=$(curl --silent --fail --max-time 15 http://${{ secrets.EC2_HOST }}/api/health || echo "FAILED")

          if echo "$HEALTH" | grep -q '"status":"healthy"'; then
            echo "✅ Deployment successful! API is healthy."
            echo "$HEALTH"
          else
            echo "❌ Health check failed. Response:"
            echo "$HEALTH"
            exit 1
          fi

      - name: 📣 Notify deployment success
        if: success()
        run: |
          echo "🎉 TaskForge AI deployed successfully!"
          echo "   Commit : ${{ github.sha }}"
          echo "   Image  : ${{ env.DOCKERHUB_USERNAME }}/taskforge-server:${{ env.IMAGE_TAG }}"
          echo "   URL    : http://${{ secrets.EC2_HOST }}"
          echo "   Time   : $(date -u)"

      - name: 🚨 Notify deployment failure
        if: failure()
        run: |
          echo "❌ Deployment FAILED for commit ${{ github.sha }}"
          echo "Check EC2 logs: docker compose logs"

      - name: 🧹 Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/ec2_key.pem
